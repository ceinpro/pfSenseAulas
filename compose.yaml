services:
  panel:
    build: .
    restart: unless-stopped
    ports:
      - "${PANEL_BIND_ADDRESS:-127.0.0.1}:${PANEL_PORT:-8445}:8443"
    volumes:
      - ./config:/config:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
